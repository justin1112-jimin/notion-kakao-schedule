<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — Notion → 카카오 일정 알림</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #eef0f4;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --radius: 14px;
    --bad-bg: #fef3f2; --bad-fg: #b42318; --bad-border: #fecdca;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b; --card: #1c1f26; --border: #2e323c;
      --text: #e8eaed; --muted: #9aa1ac; --accent: #6c93f2;
      --bad-bg: #33181a; --bad-fg: #f87171; --bad-border: #6b2530;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b; --card: #1c1f26; --border: #2e323c;
    --text: #e8eaed; --muted: #9aa1ac; --accent: #6c93f2;
    --bad-bg: #33181a; --bad-fg: #f87171; --bad-border: #6b2530;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    transition: background .15s, color .15s;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    padding: 40px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .logo { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  p { font-size: 13px; color: var(--muted); margin: 0 0 28px; line-height: 1.5; }

  .kakao-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 18px; border-radius: 8px;
    background: #FEE500; color: #3c1e1e; border: 1px solid #f0d900;
    font-size: 14px; font-weight: 600; text-decoration: none;
    transition: filter 0.15s;
  }
  .kakao-btn:hover { filter: brightness(0.96); }
  .kakao-icon { width: 18px; height: 18px; flex-shrink: 0; }

  .error {
    display: flex; align-items: center; gap: 8px; text-align: left;
    background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad-fg);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px;
  }

  .footer-note { margin-top: 24px; font-size: 11px; color: var(--muted); }
  .gh-link {
    display: block; margin-top: 12px; font-size: 11px; color: var(--muted); text-decoration: none;
  }
  .gh-link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📅</div>
  <h1>Notion → 카카오 일정 알림</h1>
  <p>매일 아침, 오늘의 일정을 카카오톡으로 받아보세요</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <a class="kakao-btn" href="/login/kakao">
    <svg class="kakao-icon" viewBox="0 0 24 24">
      <path fill="#3c1e1e" d="M12 3C6.477 3 2 6.477 2 10.75c0 2.77 1.86 5.2 4.66 6.58-.2.75-.73 2.74-.84 3.16-.13.52.19.51.4.37.16-.11 2.6-1.77 3.66-2.49.68.1 1.38.15 2.12.15 5.523 0 10-3.477 10-7.77C22 6.477 17.523 3 12 3z"/>
    </svg>
    카카오로 로그인
  </a>

  <div class="footer-note">로그인 시 서비스 이용약관에 동의하는 것으로 간주됩니다</div>
  <a class="gh-link" href="https://github.com/justin1112-jimin/notion-kakao-schedule" target="_blank" rel="noopener">⭐ GitHub에서 소스 보기</a>
</div>
</body>
</html>
