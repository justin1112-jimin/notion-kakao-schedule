<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — Notion → 카카오 일정 알림</title>
<style>
  :root {
    --bg: #eef0f4;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --radius: 14px;
    --bad-bg: #fef3f2; --bad-fg: #b42318; --bad-border: #fecdca;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    padding: 40px 32px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .logo { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  p { font-size: 13px; color: var(--muted); margin: 0 0 28px; line-height: 1.5; }

  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 12px 18px; border-radius: 8px;
    background: #fff; color: #1f2328; border: 1px solid var(--border);
    font-size: 14px; font-weight: 600; text-decoration: none;
    transition: background 0.15s;
  }
  .google-btn:hover { background: #f9fafb; }
  .google-icon { width: 18px; height: 18px; flex-shrink: 0; }

  .error {
    display: flex; align-items: center; gap: 8px; text-align: left;
    background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad-fg);
    border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 20px;
  }

  .footer-note { margin-top: 24px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">📅</div>
  <h1>Notion → 카카오 일정 알림</h1>
  <p>매일 아침, 오늘의 일정을 카카오톡으로 받아보세요</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <a class="google-btn" href="/login/google">
    <svg class="google-icon" viewBox="0 0 48 48">
      <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
      <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
      <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
      <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
    </svg>
    Google로 로그인
  </a>

  <div class="footer-note">로그인 시 서비스 이용약관에 동의하는 것으로 간주됩니다</div>
</div>
</body>
</html>
